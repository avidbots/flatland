name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  industrial_ci:
    name: ROS ${{ matrix.env.ROS_DISTRO }}
    strategy:
      matrix:
        env:
          # - {ROS_DISTRO: humble, ROS_REPO: main, DOCKER_IMAGE: 'osrf/ros:humble-desktop-full', AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: true, TARGET_WORKSPACE: '. -flatland_ros2_control_examples'}
          - {ROS_DISTRO: jazzy, ROS_REPO: main, DOCKER_IMAGE: 'osrf/ros:jazzy-desktop-full', AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: true, TARGET_WORKSPACE: '. -flatland_ros2_control_examples'}
          # - {ROS_DISTRO: kilted, ROS_REPO: main, DOCKER_IMAGE: 'osrf/ros:kilted-desktop-full', AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: true, TARGET_WORKSPACE: '. -flatland_ros2_control_examples'}
          - {ROS_DISTRO: lyrical, ROS_REPO: main, DOCKER_IMAGE: 'osrf/ros:lyrical-desktop-full', AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: true, TARGET_CMAKE_ARGS: '-DCMAKE_COMPILE_WARNING_AS_ERROR=ON', ROSDEP_SKIP_KEYS: joint_command_topic_hardware_interface, ADDITIONAL_DEBS: ros-lyrical-rmw-cyclonedds-cpp, DOCKER_RUN_OPTS: '-e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp'}
          - {ROS_DISTRO: rolling, ROS_REPO: main, OS_CODE_NAME: resolute, DOCKER_IMAGE: 'osrf/ros:rolling-desktop-full', AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: true, TARGET_CMAKE_ARGS: '-DCMAKE_COMPILE_WARNING_AS_ERROR=ON', ROSDEP_SKIP_KEYS: joint_command_topic_hardware_interface, ADDITIONAL_DEBS: ros-rolling-rmw-cyclonedds-cpp, DOCKER_RUN_OPTS: '-e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp'}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{matrix.env}}

  coverage:
    name: Coverage (ROS Lyrical)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: 'ros-industrial/industrial_ci@master'
        env:
          ROS_DISTRO: lyrical
          ROS_REPO: main
          DOCKER_IMAGE: osrf/ros:lyrical-desktop-full
          ROSDEP_SKIP_KEYS: joint_command_topic_hardware_interface
          CC: gcc
          CXX: g++
          ADDITIONAL_DEBS: gcovr ros-lyrical-rmw-cyclonedds-cpp
          DOCKER_RUN_OPTS: '-e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp'
          TARGET_CMAKE_ARGS: '-DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage -DCMAKE_SHARED_LINKER_FLAGS=--coverage'
          AFTER_SCRIPT: >-
            gcovr --root "$BASEDIR/${PREFIX}target_ws/src"
            --filter "$BASEDIR/${PREFIX}target_ws/src"
            --exclude '.*/test/.*'
            --print-summary "$BASEDIR/${PREFIX}target_ws/build"
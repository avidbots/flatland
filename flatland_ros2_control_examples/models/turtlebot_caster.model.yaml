bodies:
  - name: chassis
    type: dynamic
    color: [0.12, 0.42, 0.55, 1.0]
    footprints:
      - type: polygon
        points: [[-0.23, -0.16], [0.23, -0.16], [0.23, 0.16], [-0.23, 0.16]]
        mass: 3.09
        layers: [robot]
      - {type: polygon, points: [[-0.05, 0.135], [0.09, 0.135], [0.09, 0.185], [-0.05, 0.185]], mass: 0.35, sensor: true, layers: [robot]}
      - {type: polygon, points: [[-0.05, -0.185], [0.09, -0.185], [0.09, -0.135], [-0.05, -0.135]], mass: 0.35, sensor: true, layers: [robot]}
  - name: caster_platform
    type: dynamic
    pose: [-0.19, 0.0, 0.0]
    color: [0.3, 0.35, 0.37, 1.0]
    footprints:
      - type: circle
        radius: 0.025
        mass: 0.10
        sensor: true
        layers: [robot]
      - {type: polygon, points: [[-0.105, -0.025], [-0.035, -0.025], [-0.035, 0.025], [-0.105, 0.025]], mass: 0.18, sensor: true, layers: [robot]}
joints:
  - name: caster_swivel
    type: revolute
    bodies:
      - {name: chassis, anchor: [-0.19, 0.0]}
      - {name: caster_platform, anchor: [0.0, 0.0]}
plugins:
  - {type: DriveWheel, name: left_wheel, body: chassis, offset: [0.02, 0.16, 0.0], radius: 0.07, mode: velocity, friction: 1.2}
  - {type: DriveWheel, name: right_wheel, body: chassis, offset: [0.02, -0.16, 0.0], radius: 0.07, mode: velocity, friction: 1.2}
  - {type: FreeWheel, name: rear_caster, body: caster_platform, offset: [-0.07, 0.0, 0.0], radius: 0.035, lateral_resistance: 0.2}